services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: phosphorus_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d phosphorus_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/phosphorus_db
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../data:/app/data

volumes:
  pgdata:
