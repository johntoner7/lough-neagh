[project]
name = "runoff"
version = "0.1.0"
description = "NI River Phosphorus API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "geopandas>=1.1.3",
    "psycopg[binary]>=3.1.0",
    "psycopg2-binary>=2.9",
    "psycopg-pool>=3.1.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.17.0",
    "pandas>=3.0.2",
    "shapely>=2.0.0",
    "pyproj>=3.7.0",
    "pymannkendall>=1.4.3",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
# BLE001: broad `except Exception` is deliberate at these boundaries (readiness
# probes, best-effort cache writes) — the intent is "log and continue", not a bug.
ignore = ["BLE001"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
