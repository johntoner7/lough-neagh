name: Seed Production Database

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Base URL of the Railway service
        required: true
        type: string
      api_password:
        description: Auth token/password for the seed endpoint
        required: true
        type: string

jobs:
  seed-production-database:
    name: Seed Production Database
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Seed database
        env:
          API_URL: ${{ inputs.api_url }}
          API_PASSWORD: ${{ inputs.api_password }}
        run: |
          response_file="$(mktemp)"
          status_code="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST "${API_URL%/}/your-seed-endpoint" \
            -H "Authorization: Bearer ${API_PASSWORD}")"
          cat "$response_file"
          rm -f "$response_file"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "Seed request failed with HTTP status $status_code" >&2
            exit 1
          fi
